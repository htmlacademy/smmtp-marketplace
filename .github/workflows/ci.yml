name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Lint
        run: python3 -B scripts/validate-plugins.py

      - name: Sync
        run: |
          python3 -B scripts/sync-manifests.py --check
          python3 -B scripts/sync-skills.py --check

      - name: Policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -B scripts/check-bump.py --base "$BASE_SHA"

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install
        run: npm install -g @anthropic-ai/claude-code@2

      - name: Verify
        run: |
          claude plugin validate . --strict
          for plugin in plugins/*/; do
            echo "── $plugin"
            claude plugin validate "$plugin" --strict
          done

  publish:
    name: Publish
    needs: [lint, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r '.version' .claude-plugin/marketplace.json)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::marketplace.json carries no semver version"
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
          else
            gh release create "v$version" --target "$GITHUB_SHA" --generate-notes --title "v$version"
          fi
